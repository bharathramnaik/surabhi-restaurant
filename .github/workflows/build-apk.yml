name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore: ["package.json", "package-lock.json"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Create .env from secrets
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Bump version & inject
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VITE_APP_VERSION=$NEW_VERSION" >> .env
          echo "Building version $NEW_VERSION"

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Get version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/surabhi-hotel-v${{ steps.version.outputs.value }}.apk

      - name: Prepare public files
        run: |
          mkdir -p public-apk
          cp android/app/build/outputs/apk/debug/*.apk public-apk/
          node -e "const v=require('./package.json').version; require('fs').writeFileSync('public-apk/version.json', JSON.stringify({version:v, apk:'surabhi-hotel-v'+v+'.apk'}))"

      - name: Deploy APK to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public-apk
          keep_history: false
          force_orphan: true

      - uses: actions/upload-artifact@v4
        with:
          name: surabhi-hotel-v${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Surabhi Hotel v${{ steps.version.outputs.value }}
          body: |
            Automated APK build from commit ${{ github.sha }}.

            Install the attached APK on your Android device to get this update. The app will show an update prompt when a newer version is available.
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Commit version bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$(node -p "require('./package.json').version")" || echo "No version changes to commit"
          git push origin HEAD:main